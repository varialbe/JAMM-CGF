name: Packaging
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Derive release version
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Invalid release tag: $TAG. Use vX.Y.Z or vX.Y.Z-suffix." >&2
            exit 1
          fi
          prerelease=false
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            prerelease=true
          fi
          echo "Version=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash scripts/package-deb.sh
      - run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/packages/*
  installer:
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out/packages
      - shell: pwsh
        run: |
          $archive = Get-Item out/packages/*_win-x64.zip
          $version = $archive.BaseName -replace '^jamm-cgf_', '' -replace '_win-x64$', ''
          Expand-Archive $archive.FullName out/payload
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed. Check the Chocolatey log.' }
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc after installation." }
          & $iscc "/DAppVersion=$version" "/DPayloadDir=$pwd\out\payload" "/DOutputDir=$pwd\out\packages" packaging/windows/jamm-cgf.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/packages/*_setup.exe
  release:
    needs: [portable, installer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: out/packages
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.portable.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "JAMM-CGF $TAG")
          notes="docs/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "${args[@]}" \
            out/packages/*.deb out/packages/*_win-x64.zip out/packages/*_setup.exe
  docker:
    needs: portable
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build -t jamm-cgf:local \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.licenses=GPL-3.0" \
            --label "org.opencontainers.image.description=Mod manager and compatibility scanner for legacy Cat Goes Fishing" .
      - name: Smoke test
        run: docker run --rm jamm-cgf:local --help
      - name: Publish image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.portable.outputs.version }}
          PRERELEASE: ${{ needs.portable.outputs.prerelease }}
        run: |
          image="ghcr.io/${OWNER,,}/jamm-cgf"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker tag jamm-cgf:local "$image:$VERSION"
          docker push "$image:$VERSION"
          if [[ "$PRERELEASE" == false ]]; then
            docker tag jamm-cgf:local "$image:latest"
            docker push "$image:latest"
          fi
